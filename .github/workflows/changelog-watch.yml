name: Changelog Watch

on:
  schedule:
    # every 6 hours - adjust to taste (cron is UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (for Copilot CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run changelog check
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DLUBAL_USER: ${{ secrets.DLUBAL_USER }}
          DLUBAL_PASS: ${{ secrets.DLUBAL_PASS }}
        run: python scripts/check_changelogs.py

      - name: Commit updated state
        run: |
          git config user.name "changelog-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/versions.json
          git diff --cached --quiet || git commit -m "Update tracked versions [skip ci]"
          git push
